# Deploy: copy `.env.example` to `.env`, then:
#   docker compose up -d --build
#
# Listens on 127.0.0.1:APP_PUBLISH_PORT (default 3300) for host/debug.
# Also joins the Qubix edge network so qubix-nginx can proxy_pass to
# http://<container>:3000 (see QUBIX_DOCKER_NETWORK in .env.example).

name: treecare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://treecare.qubixsolution.com}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PUBLISH_PORT:-3300}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://treecare.qubixsolution.com}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    networks:
      - web
      - qubix_proxy

networks:
  web:
    name: treecare_web
  qubix_proxy:
    external: true
    name: ${QUBIX_DOCKER_NETWORK:-qubix-solutions_qubix-net}
