# Deploy: copy `.env.example` to `.env`, set ACME_EMAIL, then:
#   docker compose up -d --build
#
# DNS must point treecare.qubixsolution.com to this host (A/AAAA).
# Ports 80 and 443 must be reachable for Let's Encrypt (TLS-ALPN challenge).

name: treecare

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=treecare_web
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Send all HTTP visitors to HTTPS (LE uses TLS-ALPN on 443, not port 80)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt — certificates stored on volume `letsencrypt`
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Uncomment for testing (avoid LE rate limits): use staging CA
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://treecare.qubixsolution.com}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=treecare_web
      # HTTPS + automatic certificate
      - traefik.http.routers.treecare.rule=Host(`treecare.qubixsolution.com`)
      - traefik.http.routers.treecare.entrypoints=websecure
      - traefik.http.routers.treecare.tls=true
      - traefik.http.routers.treecare.tls.certresolver=letsencrypt
      - traefik.http.services.treecare.loadbalancer.server.port=3000

networks:
  web:
    name: treecare_web

volumes:
  letsencrypt:
