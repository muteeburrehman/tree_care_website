# Deploy: copy `.env.example` to `.env`, then:
#   docker compose up -d --build
#
# App listens on 127.0.0.1:APP_PUBLISH_PORT (default 3300) for your existing
# nginx/Caddy/etc. on this VPS. No Traefik, no binding to :80/:443.

name: treecare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://treecare.qubixsolution.com}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PUBLISH_PORT:-3300}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://treecare.qubixsolution.com}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    networks:
      - web

networks:
  web:
    name: treecare_web
